skill: "egm-drift-report"
description: "egm-drift-report 技能的行为评估场景套件。"

scenarios:
  - scenario_id: "detect_all_drift"
    description: "将已实现代码与设计规格进行比对；验证是否识别出所有文档与实现的差异。"
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-drift-report/SKILL.md"
    turns:
      - user_input: "针对已实现的源文件，对 `docs/designs/drift_report.md` 运行 egm-drift-report。"
        assertions:
          - type: "required_pattern"
            pattern: "(drift|discrepancy|matches|out of sync|report)"
            message: "漂移报告必须评估设计文档与源代码之间的一致性。"
