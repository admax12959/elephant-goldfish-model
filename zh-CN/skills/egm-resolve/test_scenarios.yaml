skill: "egm-resolve"
description: "egm-resolve 技能的行为评估场景套件。"

scenarios:
  - scenario_id: "resolve_findings_gate"
    description: "验证评审意见被系统性地分类、处理与核验。"
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-resolve/SKILL.md"
    turns:
      - user_input: "运行 egm-resolve，参数 TargetFile: docs/design.md，Finding: 第 2 行缺少 SLO。"
        assertions:
          - type: "required_pattern"
            pattern: "(report|findings|resolve|SLO|comment)"
            message: "评审裁决技能必须整理评审发现报告并提示用户裁决。"

  - scenario_id: "escalate_uncheckable_contest"
    description: "验证仅基于受审文件之外知识的反驳会被上报裁决（ESCALATE），而不是提出异议或直接修复。"
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-resolve/SKILL.md"
    turns:
      - user_input: "运行 egm-resolve，参数 TargetFile: docs/design.md，Finding (Major): 导出任务缺少重试策略。团队曾口头约定导出任务绝不重试，但没有任何文件记录此事。"
        assertions:
          - type: "required_pattern"
            pattern: "ESCALATE"
            message: "无任何受审文件支持的反驳必须上报给用户（ESCALATE）。"
